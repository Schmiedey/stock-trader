services:
  - type: web
    name: stock-trader
    runtime: docker
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8791
      # Paper ledgers persist to the paper-ledger branch (free-tier disk is wiped on deploy).
      # No secret needed: .github/workflows/ledger-sync.yml pulls /api/ledger every 10 min and
      # the app restores from the public branch on boot. GITHUB_TOKEN (optional, set in the
      # dashboard) switches to push-on-change every 5 min instead.
      - key: GITHUB_REPO
        value: Schmiedey/stock-trader
      - key: LEDGER_BRANCH
        value: paper-ledger
